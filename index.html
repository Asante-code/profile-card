<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Card</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/c7b2e6c21c.js" crossorigin="anonymous"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="font-[Poppins]">

    <!-- Page Background -->
    <div class="flex items-center justify-center min-h-screen bg-[#020712] p-4">

        <!-- Business Card -->
        <div id="vcard"
            class="flex flex-col items-center justify-center gap-3
                   w-[22rem] max-w-full py-8 px-4
                   bg-transparent
                   border-2 border-white
                   rounded-xl">

            <!-- Profile Image -->
            <img src="Profile.jpeg"
                alt="Profile-pic"
                class="w-[8rem] h-[8rem] rounded-full object-cover">

            <!-- Name -->
            <h1 class="text-white text-xl font-bold">Anakwah</h1>

            <!-- Title -->
            <p class="text-white text-sm font-semibold text-center">Robotics | Software Engineering | Artificial Intelligence</p>

            <!-- Contact Links -->
            <div class="flex items-center justify-center gap-6 text-white text-xl">
                <a href="mailto:kelvinanakwah3@gmail.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
                <a href="tel:+233245150859" aria-label="Phone"><i class="fa-solid fa-phone"></i></a>
                <a href="https://github.com/Asante-code" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="linkedin.com/in/kelvin-anakwah" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
            </div>

        </div>

    </div>

</body>

</html>
